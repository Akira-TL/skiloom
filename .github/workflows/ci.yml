name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build skiloom-lock
        run: cargo +1.89.0 build --manifest-path native/skiloom-lock/Cargo.toml --locked
      - run: npm run check
        env:
          SKILOOM_LOCK_TEST_BINARY: ${{ github.workspace }}/native/skiloom-lock/target/debug/skiloom-lock

  target-projection:
    name: Target projection (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:target-projection
      - run: npm run test:host-observation-platform

  native-lock:
    name: Rust lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Test skiloom-lock
        run: cargo +1.89.0 test --manifest-path native/skiloom-lock/Cargo.toml --locked

  lock-bridge:
    name: Lock bridge (Node 22 / Rust 1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build skiloom-lock
        run: cargo +1.89.0 build --manifest-path native/skiloom-lock/Cargo.toml --locked
      - name: Test Node lock bridge with real helper
        run: npm run test:lock-bridge
        env:
          SKILOOM_LOCK_TEST_BINARY: ${{ github.workspace }}/native/skiloom-lock/target/debug/skiloom-lock
      - name: Test locked Machine State integration
        run: npm run test:machine-state
        env:
          SKILOOM_LOCK_TEST_BINARY: ${{ github.workspace }}/native/skiloom-lock/target/debug/skiloom-lock

  package-install:
    name: Packed install (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            os: ubuntu-24.04
            binary: native/skiloom-lock/target/release/skiloom-lock
          - target: darwin-x64
            os: macos-15-intel
            binary: native/skiloom-lock/target/release/skiloom-lock
          - target: darwin-arm64
            os: macos-15
            binary: native/skiloom-lock/target/release/skiloom-lock
          - target: win32-x64
            os: windows-2025
            binary: native/skiloom-lock/target/release/skiloom-lock.exe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build release skiloom-lock
        run: cargo +1.89.0 build --manifest-path native/skiloom-lock/Cargo.toml --locked --release
      - name: Pack and install without Rust runtime dependency
        run: npm run test:package-install
        env:
          SKILOOM_LOCK_PACKAGE_BINARY: ${{ github.workspace }}/${{ matrix.binary }}
      - name: Pack helper artifact
        run: npm run package:lock-helper -- ${{ matrix.target }} "${{ github.workspace }}/${{ matrix.binary }}" artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: skiloom-lock-${{ matrix.target }}
          path: artifacts/*.tgz
          if-no-files-found: error
