name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag to verify from the npm registry"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run verify:release-version -- "${GITHUB_REF_NAME}"

  ci:
    name: Release CI
    if: github.event_name == 'push'
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  stage:
    name: Stage npm packages
    if: github.event_name == 'push'
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.21.2
      - run: npm run verify:release-version -- "${GITHUB_REF_NAME}"
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          pattern: skiloom-lock-*
          path: artifacts
          merge-multiple: true
      - name: Pack main package
        run: npm pack --pack-destination artifacts
      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for package in skiloom-lock-darwin-arm64 skiloom-lock-darwin-x64 skiloom-lock-linux-x64-gnu skiloom-lock-win32-x64-msvc; do
            test -f "artifacts/${package}-${version}.tgz"
          done
          test -f "artifacts/skiloom-${version}.tgz"
      - name: Stage helpers then main package with OIDC
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          stage_if_unpublished() {
            package_name="$1"
            tarball="$2"
            local_sha="$(node -e "const fs=require('node:fs'); const crypto=require('node:crypto'); const bytes=fs.readFileSync(process.argv[1]); process.stdout.write(crypto.createHash('sha1').update(bytes).digest('hex'));" "${tarball}")"

            if existing_sha="$(npm view "${package_name}@${version}" dist.shasum 2>/dev/null)"; then
              if [ -z "${existing_sha}" ] || [ "${existing_sha}" != "${local_sha}" ]; then
                echo "::error::${package_name}@${version} already exists with different tarball content"
                exit 1
              fi
              echo "${package_name}@${version} already exists with matching tarball; skipping"
              return
            fi

            npm stage publish "./${tarball}" --access public
          }

          for package in skiloom-lock-darwin-arm64 skiloom-lock-darwin-x64 skiloom-lock-linux-x64-gnu skiloom-lock-win32-x64-msvc; do
            stage_if_unpublished "${package}" "artifacts/${package}-${version}.tgz"
          done

          stage_if_unpublished "skiloom" "artifacts/skiloom-${version}.tgz"

  registry-smoke:
    name: Registry install (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            os: ubuntu-24.04
          - target: darwin-x64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-15
          - target: win32-x64
            os: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm used by registry smoke
        run: npm install --global npm@11.21.2
      - run: npm run verify:release-version -- "${{ inputs.release_tag }}"
      - run: npm run test:registry-install
